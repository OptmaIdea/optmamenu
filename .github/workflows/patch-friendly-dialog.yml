name: Patch friendly cart dialog

on:
  push:
    branches:
      - agent/homologacao-geral-20260820
    paths:
      - .github/workflows/patch-friendly-dialog.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/homologacao-geral-20260820
          fetch-depth: 0

      - name: Replace native cart confirmation
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/pages/store/Checkout.tsx')
          text = path.read_text()

          import_anchor = "import { formatBRL } from '@/utils/pricing';\n"
          import_line = "import { systemConfirm } from '@/components/common/SystemDialogProvider';\n"
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('import anchor not found')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          old = """                            onClick={() => {\n                                if (window.confirm('Deseja realmente limpar seu carrinho? Os dados de entrega e identificação serão preservados.')) {\n                                    clearCart();\n                                    navigate(storePath, { replace: true });\n                                }\n                            }}"""
          new = """                            onClick={async () => {\n                                const confirmed = await systemConfirm({\n                                    title: 'Limpar seu carrinho?',\n                                    description: 'Os itens serão removidos do carrinho. Seus dados de entrega e identificação continuarão salvos neste dispositivo.',\n                                    confirmLabel: 'Sim, limpar',\n                                    cancelLabel: 'Manter itens',\n                                    tone: 'danger',\n                                });\n                                if (!confirmed) return;\n\n                                clearCart();\n                                navigate(storePath, { replace: true });\n                            }}"""

          if old not in text:
              raise SystemExit('native confirmation block not found')
          text = text.replace(old, new, 1)
          path.write_text(text)

      - name: Commit patch
        run: |
          git config user.name "Optima Idea"
          git config user.email "optmaidea@gmail.com"
          git add src/pages/store/Checkout.tsx
          git commit -m "fix: substitui confirmação nativa do carrinho"
          git push origin HEAD:agent/homologacao-geral-20260820
