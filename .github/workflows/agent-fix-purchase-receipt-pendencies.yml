name: Agent fix purchase receipt pendencies

on:
  push:
    branches:
      - agent/homologacao-geral-20260820

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/homologacao-geral-20260820
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply focused receipt-pendency fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Anchor not found for {label}: {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          stock = 'src/pages/private/admin/products/inventory/StockDiscrepanciesPage.tsx'
          modal = 'src/pages/private/admin/products/inventory/components/PurchaseReceiptModal.tsx'
          docs = 'src/pages/private/admin/products/inventory/PurchaseDocumentsPage.tsx'

          replace_once(
              stock,
              "  const canOpenPurchases = hasPermission('purchases.view') || hasPermission('purchases.confirm') || hasPermission('purchases.cancel');\n",
              "  const canOpenPurchases = hasPermission('purchases.view') || hasPermission('purchases.confirm') || hasPermission('purchases.cancel');\n  const canTreatPurchaseIssues = hasPermission('purchases.confirm');\n  const canCancelPurchaseIssues = hasPermission('purchases.cancel');\n",
              'purchase issue permissions',
          )

          replace_once(
              stock,
              "  const focusedOrderId = searchParams.get('orderId');\n  const returnTo = searchParams.get('returnTo');\n",
              "  const focusedOrderId = searchParams.get('orderId');\n  const focusedPurchaseIssueCode = searchParams.get('issue');\n  const returnTo = searchParams.get('returnTo');\n",
              'focused purchase issue param',
          )

          replace_once(
              stock,
              "  const [saving, setSaving] = useState(false);\n",
              "  const [saving, setSaving] = useState(false);\n  const [selectedPurchaseIssue, setSelectedPurchaseIssue] = useState<PurchaseReceiptIssueQueueItem | null>(null);\n  const [purchaseIssueAction, setPurchaseIssueAction] = useState<'treatment' | 'resolve' | 'cancel'>('resolve');\n  const [purchaseIssueDisposition, setPurchaseIssueDisposition] = useState<PurchaseIssueDisposition>('partial_return');\n  const [purchaseIssueNotes, setPurchaseIssueNotes] = useState('');\n  const [purchaseIssueReference, setPurchaseIssueReference] = useState('');\n  const [purchaseIssueSaving, setPurchaseIssueSaving] = useState(false);\n",
              'purchase issue modal state',
          )

          replace_once(
              stock,
              "  useEffect(() => {\n    if (focusedOrderId) setStatus('all');\n  }, [focusedOrderId]);\n",
              "  useEffect(() => {\n    if (focusedOrderId) setStatus('all');\n  }, [focusedOrderId]);\n\n  useEffect(() => {\n    if (!focusedPurchaseIssueCode) return;\n    const issue = purchaseIssues.find((item) => item.issue_code === focusedPurchaseIssueCode);\n    if (!issue) return;\n    setSearch(focusedPurchaseIssueCode);\n    setSelectedPurchaseIssue(issue);\n    setPurchaseIssueAction(issue.issue_status === 'waiting_supplier' ? 'treatment' : 'resolve');\n    setPurchaseIssueDisposition(issue.disposition);\n    setPurchaseIssueNotes('');\n    setPurchaseIssueReference(issue.resolution_reference || '');\n  }, [focusedPurchaseIssueCode, purchaseIssues]);\n",
              'focus purchase issue effect',
          )

          functions_anchor = "  function goBack() {\n"
          functions_insert = r'''  function beginPurchaseIssueTreatment(issue: PurchaseReceiptIssueQueueItem, action?: 'treatment' | 'resolve' | 'cancel') {
    setSelectedPurchaseIssue(issue);
    setPurchaseIssueAction(action || (issue.issue_status === 'waiting_supplier' ? 'treatment' : 'resolve'));
    setPurchaseIssueDisposition(issue.disposition);
    setPurchaseIssueNotes('');
    setPurchaseIssueReference(issue.resolution_reference || '');
  }

  async function savePurchaseIssueTreatment() {
    if (!selectedPurchaseIssue || !canTreatPurchaseIssues || purchaseIssueSaving) return;
    const notes = purchaseIssueNotes.trim();
    const reference = purchaseIssueReference.trim();
    if ((purchaseIssueAction === 'resolve' || purchaseIssueAction === 'cancel') && notes.length < 3) {
      toast.error(purchaseIssueAction === 'resolve' ? 'Descreva como a pendência foi resolvida.' : 'Informe o motivo do cancelamento.');
      return;
    }
    if (purchaseIssueAction === 'cancel' && !canCancelPurchaseIssues) {
      toast.error('Você não tem permissão para cancelar esta ressalva.');
      return;
    }
    try {
      setPurchaseIssueSaving(true);
      if (purchaseIssueAction === 'treatment') {
        const { error } = await supabase.rpc('update_purchase_receipt_issue_treatment', {
          p_issue_id: selectedPurchaseIssue.issue_id,
          p_disposition: purchaseIssueDisposition,
          p_notes: notes || null,
          p_resolution_reference: reference || null,
        });
        if (error) throw error;
        toast.success('Tratativa atualizada e auditada.');
      } else if (purchaseIssueAction === 'resolve') {
        const { error } = await supabase.rpc('resolve_purchase_receipt_issue', {
          p_issue_id: selectedPurchaseIssue.issue_id,
          p_resolution_notes: notes,
          p_resolution_reference: reference || null,
        });
        if (error) throw error;
        toast.success('Pendência resolvida e preservada no histórico.');
      } else {
        const { error } = await supabase.rpc('cancel_purchase_receipt_issue', {
          p_issue_id: selectedPurchaseIssue.issue_id,
          p_reason: notes,
        });
        if (error) throw error;
        toast.success('Ressalva cancelada sem apagar o histórico.');
      }
      setSelectedPurchaseIssue(null);
      await load();
    } catch (error) {
      console.error('Erro ao tratar pendência de recebimento:', error);
      toast.error(error instanceof Error ? error.message : 'Não foi possível atualizar a pendência.');
    } finally {
      setPurchaseIssueSaving(false);
    }
  }

'''
          replace_once(stock, functions_anchor, functions_insert + functions_anchor, 'purchase issue handlers')

          replace_once(
              stock,
              "                <h2 className=\"mt-1 text-lg font-black text-gray-900 dark:text-white\">Ressalvas de recebimento de compras</h2>\n                <p className=\"mt-1 max-w-3xl text-xs text-gray-500 dark:text-gray-400\">Faltas, avarias, itens incorretos, excessos, reposições, abatimentos, créditos e devoluções permanecem auditados até a solução final.</p>\n",
              "                <h2 className=\"mt-1 text-lg font-black text-gray-900 dark:text-white\">Pendências de recebimento</h2>\n                <p className=\"mt-1 max-w-3xl text-xs text-gray-500 dark:text-gray-400\">Fila operacional para tratar reposições, abatimentos, créditos e devoluções. Registre referência/protocolo, observação e conclusão sem reabrir a obrigação física já encerrada.</p>\n",
              'purchase issue section heading',
          )

          old_action = '''                      {canOpenPurchases && (\n                        <button type="button" onClick={() => navigate(`/admin/products/inventory/purchases?open=${encodeURIComponent(issue.purchase_document_id)}`)} className="h-fit shrink-0 rounded-xl border border-teal-300 bg-white px-4 py-2 text-sm font-black text-teal-700 hover:bg-teal-50 dark:border-teal-700 dark:bg-gray-950 dark:text-teal-200 dark:hover:bg-teal-950/30">\n                          Abrir compra\n                        </button>\n                      )}'''.replace('\\n', '\n')
          new_action = '''                      <div className="flex h-fit shrink-0 flex-wrap gap-2">\n                        {canTreatPurchaseIssues && !['resolved', 'cancelled'].includes(issue.issue_status) && (\n                          <button type="button" onClick={() => beginPurchaseIssueTreatment(issue)} className="rounded-xl bg-teal-600 px-4 py-2 text-sm font-black text-white hover:bg-teal-700">\n                            Tratar pendência\n                          </button>\n                        )}\n                        {canOpenPurchases && (\n                          <button type="button" onClick={() => navigate(`/admin/stock/purchase-documents?open=${encodeURIComponent(issue.purchase_document_id)}`)} className="rounded-xl border border-teal-300 bg-white px-4 py-2 text-sm font-black text-teal-700 hover:bg-teal-50 dark:border-teal-700 dark:bg-gray-950 dark:text-teal-200 dark:hover:bg-teal-950/30">\n                            Abrir compra\n                          </button>\n                        )}\n                      </div>'''.replace('\\n', '\n')
          replace_once(stock, old_action, new_action, 'purchase issue card actions')

          sales_modal_anchor = "      {selected && (\n"
          purchase_modal = r'''      {selectedPurchaseIssue && (
        <div className="fixed inset-0 z-[105] flex items-end justify-center bg-black/55 sm:items-center sm:p-4">
          <div className="max-h-[92vh] w-full max-w-2xl overflow-y-auto rounded-t-3xl bg-white p-5 shadow-2xl dark:bg-gray-900 sm:rounded-3xl">
            <div className="flex items-start justify-between gap-3">
              <div>
                <p className="text-xs font-black uppercase tracking-[0.16em] text-amber-600 dark:text-amber-300">Pendência de recebimento</p>
                <h2 className="mt-1 text-xl font-black text-gray-900 dark:text-white">{selectedPurchaseIssue.issue_code}</h2>
                <p className="mt-1 text-sm text-gray-500 dark:text-gray-400">{selectedPurchaseIssue.document_code || getShortDocumentReference(selectedPurchaseIssue.purchase_document_id, { fallbackLabel: 'Compra' })} · {selectedPurchaseIssue.supplier_name}</p>
              </div>
              <span className={`rounded-full px-3 py-1 text-xs font-black ${purchaseIssueBadgeClass(selectedPurchaseIssue.issue_status)}`}>{PURCHASE_ISSUE_STATUS_LABELS[selectedPurchaseIssue.issue_status]}</span>
            </div>

            <div className="mt-4 grid gap-3 sm:grid-cols-3">
              <div className="rounded-2xl bg-gray-50 p-3 dark:bg-gray-950/60"><p className="text-xs font-black uppercase tracking-wider text-gray-400">Produto</p><p className="mt-1 font-black text-gray-900 dark:text-white">{selectedPurchaseIssue.product_name}</p></div>
              <div className="rounded-2xl bg-gray-50 p-3 dark:bg-gray-950/60"><p className="text-xs font-black uppercase tracking-wider text-gray-400">Quantidade</p><p className="mt-1 font-black text-gray-900 dark:text-white">{formatQuantity(selectedPurchaseIssue.quantity)} un.</p></div>
              <div className="rounded-2xl bg-gray-50 p-3 dark:bg-gray-950/60"><p className="text-xs font-black uppercase tracking-wider text-gray-400">Impacto</p><p className="mt-1 font-black text-gray-900 dark:text-white">{formatMoney(selectedPurchaseIssue.estimated_amount)}</p></div>
            </div>

            {Number(selectedPurchaseIssue.physical_closed_quantity) > 0 && (
              <p className="mt-4 rounded-xl border border-emerald-200 bg-emerald-50 p-3 text-xs font-bold text-emerald-800 dark:border-emerald-900 dark:bg-emerald-950/30 dark:text-emerald-200">
                Obrigação física encerrada em {formatQuantity(selectedPurchaseIssue.physical_closed_quantity)} un. Esta tratativa não reabre quantidade para recebimento.
              </p>
            )}

            <div className="mt-5 space-y-4">
              <label className="block text-sm font-black text-gray-700 dark:text-gray-200">Ação
                <select value={purchaseIssueAction} onChange={(event) => setPurchaseIssueAction(event.target.value as 'treatment' | 'resolve' | 'cancel')} className="mt-2 w-full rounded-xl border border-gray-200 bg-white px-3 py-2 dark:border-gray-700 dark:bg-gray-950 dark:text-white">
                  <option value="treatment">Alterar tratativa</option>
                  {selectedPurchaseIssue.issue_status !== 'waiting_supplier' && <option value="resolve">Registrar solução e concluir</option>}
                  {canCancelPurchaseIssues && <option value="cancel">Cancelar ressalva</option>}
                </select>
              </label>

              {purchaseIssueAction === 'treatment' && (
                <label className="block text-sm font-black text-gray-700 dark:text-gray-200">Tratativa
                  <select value={purchaseIssueDisposition} onChange={(event) => setPurchaseIssueDisposition(event.target.value as PurchaseIssueDisposition)} className="mt-2 w-full rounded-xl border border-gray-200 bg-white px-3 py-2 dark:border-gray-700 dark:bg-gray-950 dark:text-white">
                    <option value="awaiting_replacement">Fornecedor vai repor</option>
                    <option value="discount">Abatimento / desconto</option>
                    <option value="supplier_credit">Crédito / bonificação</option>
                    <option value="partial_return">Devolução parcial</option>
                    <option value="accepted_closed">Aceitar diferença e encerrar</option>
                    <option value="other">Outra tratativa</option>
                  </select>
                </label>
              )}

              <label className="block text-sm font-black text-gray-700 dark:text-gray-200">{purchaseIssueAction === 'cancel' ? 'Motivo do cancelamento' : purchaseIssueAction === 'resolve' ? 'Como a pendência foi resolvida?' : 'Observação da tratativa'}
                <textarea value={purchaseIssueNotes} onChange={(event) => setPurchaseIssueNotes(event.target.value)} rows={4} className="mt-2 w-full rounded-xl border border-gray-200 bg-white px-3 py-2 dark:border-gray-700 dark:bg-gray-950 dark:text-white" placeholder={purchaseIssueAction === 'resolve' ? 'Ex.: devolução entregue ao fornecedor e documento recebido.' : 'Registre o andamento da tratativa.'} />
              </label>

              {purchaseIssueAction !== 'cancel' && (
                <label className="block text-sm font-black text-gray-700 dark:text-gray-200">Referência / protocolo / documento <span className="font-semibold text-gray-400">(opcional)</span>
                  <input value={purchaseIssueReference} onChange={(event) => setPurchaseIssueReference(event.target.value)} className="mt-2 w-full rounded-xl border border-gray-200 bg-white px-3 py-2 dark:border-gray-700 dark:bg-gray-950 dark:text-white" placeholder="Ex.: protocolo, NF de devolução, crédito ou acordo" />
                </label>
              )}
            </div>

            <div className="mt-6 flex flex-col-reverse gap-2 sm:flex-row sm:justify-between">
              <button type="button" onClick={() => navigate(`/admin/stock/purchase-documents?open=${encodeURIComponent(selectedPurchaseIssue.purchase_document_id)}`)} className="rounded-xl border border-teal-300 px-4 py-2 text-sm font-black text-teal-700 dark:border-teal-700 dark:text-teal-200">Abrir compra</button>
              <div className="flex flex-col-reverse gap-2 sm:flex-row">
                <button type="button" onClick={() => setSelectedPurchaseIssue(null)} className="rounded-xl border border-gray-200 px-4 py-2 text-sm font-black dark:border-gray-700 dark:text-white">Fechar</button>
                <button type="button" onClick={() => void savePurchaseIssueTreatment()} disabled={purchaseIssueSaving} className={`rounded-xl px-4 py-2 text-sm font-black text-white disabled:opacity-60 ${purchaseIssueAction === 'cancel' ? 'bg-rose-600' : 'bg-teal-600'}`}>{purchaseIssueSaving ? 'Salvando…' : purchaseIssueAction === 'resolve' ? 'Concluir pendência' : purchaseIssueAction === 'cancel' ? 'Cancelar ressalva' : 'Salvar tratativa'}</button>
              </div>
            </div>
          </div>
        </div>
      )}

'''
          replace_once(stock, sales_modal_anchor, purchase_modal + sales_modal_anchor, 'purchase issue treatment modal')

          replace_once(
              modal,
              "import { useCallback, useEffect, useMemo, useState } from 'react'\n",
              "import { useCallback, useEffect, useMemo, useState } from 'react'\nimport { useNavigate } from 'react-router-dom'\n",
              'modal navigate import',
          )
          replace_once(
              modal,
              "  } = props\n  const [locationId, setLocationId] = useState('')\n",
              "  } = props\n  const navigate = useNavigate()\n  const [locationId, setLocationId] = useState('')\n",
              'modal navigate hook',
          )
          replace_once(
              modal,
              "        toast.success('Tratativa atualizada e auditada.')\n        await loadIssues()\n        window.location.reload()\n        return\n",
              "        toast.success('Tratativa atualizada e auditada.')\n        closeIssueAction()\n        await loadIssues()\n        return\n",
              'remove hard reload after treatment',
          )
          replace_once(
              modal,
              "      toast.success('Ressalva cancelada sem apagar o histórico.')\n      await loadIssues()\n      window.location.reload()\n",
              "      toast.success('Ressalva cancelada sem apagar o histórico.')\n      closeIssueAction()\n      await loadIssues()\n",
              'remove hard reload after cancel',
          )
          replace_once(
              modal,
              "                {openIssue && canReceive && <div className=\"flex h-fit flex-wrap gap-2\">",
              "                {openIssue && <button type=\"button\" onClick={() => { onClose(); navigate(`/admin/stock/divergences?issue=${encodeURIComponent(issue.issue_code)}`) }} className=\"h-fit rounded-lg bg-teal-600 px-2.5 py-1.5 text-xs font-semibold text-white\">Tratar pendência</button>}\n                {openIssue && canReceive && <div className=\"flex h-fit flex-wrap gap-2\">",
              'modal central treatment button',
          )

          replace_once(
              docs,
              "          Recebida {received.toLocaleString('pt-BR')} de {ordered.toLocaleString('pt-BR')} · Pendente {pending.toLocaleString('pt-BR')}\n",
              "          {doc.status === 'confirmed' && pending > 0 ? (\n            <>Recebida {received.toLocaleString('pt-BR')} de {ordered.toLocaleString('pt-BR')} · Entrada física encerrada · {pending.toLocaleString('pt-BR')} un. em ressalva comercial/documental</>\n          ) : (\n            <>Recebida {received.toLocaleString('pt-BR')} de {ordered.toLocaleString('pt-BR')} · Pendente {pending.toLocaleString('pt-BR')}</>\n          )}\n",
              'purchase summary physical closure semantics',
          )

          # Fail the job if a hard reload remains in the receipt modal.
          modal_text = Path(modal).read_text(encoding='utf-8')
          if 'window.location.reload()' in modal_text:
              raise SystemExit('Hard reload still present in PurchaseReceiptModal.tsx')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name "optmamenu-agent"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/agent-fix-purchase-receipt-pendencies.yml
          git add src/pages/private/admin/products/inventory/StockDiscrepanciesPage.tsx
          git add src/pages/private/admin/products/inventory/components/PurchaseReceiptModal.tsx
          git add src/pages/private/admin/products/inventory/PurchaseDocumentsPage.tsx
          git commit -m "feat: conclui tratamento de pendencias de recebimento"
          git push origin HEAD:agent/homologacao-geral-20260820
