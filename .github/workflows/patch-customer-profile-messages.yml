name: Patch customer profile messages

on:
  push:
    branches:
      - agent/homologacao-geral-20260820
    paths:
      - .github/workflows/patch-customer-profile-messages.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/homologacao-geral-20260820
          fetch-depth: 0

      - name: Replace native alerts and confirms
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/pages/store/components/CustomerProfile.tsx')
          text = path.read_text(encoding='utf-8')
          original = text

          anchor = "import { timezoneUtils } from '@/utils/timezoneUtils';"
          if "from 'sonner'" not in text:
              text = text.replace(anchor, anchor + "\nimport { toast } from 'sonner';\nimport { systemConfirm } from '@/components/common/SystemDialogProvider';")

          replacements = {
              "alert('Dados atualizados com sucesso!');": "toast.success('Dados atualizados com sucesso!');",
              "alert(err.message || 'Erro ao atualizar dados.');": "toast.error(err.message || 'Erro ao atualizar dados.');",
              "if (cep.length !== 8) return alert('CEP inválido');": "if (cep.length !== 8) {\n            toast.error('Informe um CEP válido com 8 dígitos.');\n            return;\n        }",
              "alert('CEP não encontrado');": "toast.error('CEP não encontrado. Confira o número informado.');",
              "alert('Você já atingiu o limite máximo de 3 endereços.');": "toast.warning('Você pode manter no máximo 3 endereços salvos.');",
              "alert('Erro ao salvar endereço.');": "toast.error('Não foi possível salvar o endereço. Tente novamente.');",
              "} catch (_) { alert('Erro ao excluir'); }": "} catch (_) {\n            toast.error('Não foi possível excluir o endereço. Tente novamente.');\n        }",
              "alert('🎉 Parabéns! Você agora faz parte do nosso Clube de Pontos!');": "toast.success('Parabéns! Você agora faz parte do nosso Clube de Pontos!');",
              "alert('Erro ao atualizar preferência de fidelidade.');": "toast.error('Não foi possível atualizar sua preferência de fidelidade.');",
              "onClick={() => alert('Em breve: Enviaremos um link para seu e-mail.')}": "onClick={() => toast.info('A alteração de dados sensíveis será habilitada em uma próxima etapa. Nenhum dado foi alterado.')}",
              "alert('Funcionalidade de exclusão de conta em desenvolvimento. Sua conta não foi excluída.');": "toast.info('A exclusão de conta ainda não está habilitada. Nenhum dado foi alterado.')",
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)

          delete_old = "if (!confirm('Excluir endereço?')) return;"
          delete_new = "confirmed = await systemConfirm({\n            title: 'Excluir endereço?',\n            description: 'Este endereço será removido da sua conta. Se ele for o endereço padrão, outro endereço salvo poderá assumir como padrão.',\n            confirmLabel: 'Excluir endereço',\n            cancelLabel: 'Manter endereço',\n            tone: 'danger',\n        });\n        if (!confirmed) return;"
          if delete_old in text:
              text = text.replace(delete_old, delete_new)

          loyalty_pattern = re.compile(r"onClick=\{\(\) => \{\s*if \(window\.confirm\('Tem certeza\? Você perderá acesso a benefícios exclusivos e seus pontos poderão ser expirados\.'\)\) \{\s*handleLoyaltyOptIn\(false\);\s*\}\s*\}\}")
          loyalty_new = "onClick={async () => {\n                                            const confirmed = await systemConfirm({\n                                                title: 'Sair do Clube de Pontos?',\n                                                description: 'Você deixará de participar dos benefícios do programa. Seus pontos seguirão as regras de expiração da loja.',\n                                                confirmLabel: 'Sair do clube',\n                                                cancelLabel: 'Continuar participando',\n                                                tone: 'danger',\n                                            });\n                                            if (confirmed) await handleLoyaltyOptIn(false);\n                                        }}"
          text, loyalty_count = loyalty_pattern.subn(loyalty_new, text)

          account_pattern = re.compile(r"onClick=\{\(\) => \{\s*if \(window\.confirm\('Tem certeza que deseja excluir sua conta\? Esta ação não pode ser desfeita\.'\)\) \{\s*if \(window\.confirm\('Confirmação final: Todos os seus pontos e dados serão perdidos\. Deseja continuar\?'\)\) \{\s*// Placeholder for CustomerService\.deleteAccount and logout/onClose\s*toast\.info\('A exclusão de conta ainda não está habilitada\. Nenhum dado foi alterado\.'\)\s*// CustomerService\.deleteAccount\(customer!\.id\)[\s\S]*?\}\s*\}\s*\}\}")
          account_new = "onClick={async () => {\n                                        const confirmed = await systemConfirm({\n                                            title: 'Excluir minha conta?',\n                                            description: 'A exclusão é uma ação sensível. Nesta versão ela ainda não está habilitada, portanto esta confirmação não removerá nenhum dado.',\n                                            confirmLabel: 'Entendi',\n                                            cancelLabel: 'Cancelar',\n                                            tone: 'danger',\n                                        });\n                                        if (confirmed) {\n                                            toast.info('A exclusão de conta ainda não está habilitada. Nenhum dado foi alterado.');\n                                        }\n                                    }}"
          text, account_count = account_pattern.subn(account_new, text)

          # Fallback para qualquer alerta nativo remanescente: mantém a mensagem,
          # mas passa pela camada visual do produto.
          text = re.sub(r"(?<![\w.])alert\(", "toast.info(", text)

          if "window.confirm(" in text or re.search(r"(?<![\w.])confirm\(", text):
              raise SystemExit('Ainda há confirmação nativa em CustomerProfile.tsx')
          if re.search(r"(?<![\w.])alert\(", text):
              raise SystemExit('Ainda há alerta nativo em CustomerProfile.tsx')
          if text == original:
              raise SystemExit('Nenhuma alteração foi aplicada')

          path.write_text(text, encoding='utf-8')
          print(f'loyalty confirmations converted: {loyalty_count}')
          print(f'account deletion confirmations converted: {account_count}')

      - name: Validate build
        run: |
          npm ci
          npm run build

      - name: Commit patch
        run: |
          git config user.name "Optima Idea"
          git config user.email "optmaidea@gmail.com"
          git add src/pages/store/components/CustomerProfile.tsx
          git commit -m "ux: padroniza avisos do perfil do cliente"
          git push origin HEAD:agent/homologacao-geral-20260820
