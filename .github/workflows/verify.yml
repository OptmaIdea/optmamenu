name: Verify

on:
  push:
    branches:
      - agent/quotation-round-purchase-drafts
      - agent/homologacao-geral-20260820
  pull_request:
    branches:
      - agent/homologacao-geral-20260820

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint purchase receipt scope
        run: >-
          npx eslint
          src/pages/private/admin/products/inventory/PurchaseDocumentsPage.tsx
          src/pages/private/admin/products/inventory/components/PurchaseReceiptModal.tsx
          src/pages/private/admin/products/inventory/utils/purchaseReceiptUtils.ts
          src/pages/private/admin/products/inventory/utils/purchaseReceiptUtils.test.ts

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build
