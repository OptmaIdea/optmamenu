            psql -h 127.0.0.1 -U postgres -d optmamenu_p04_calendar \
            -v ON_ERROR_STOP=1 -f supabase/tests/p04_financial_calendar_search_path_pg17.sql

  p04-signed-jwt-rls:
    name: P04 signed JWT HTTP customer/store isolation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: optmamenu_p04_jwt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d optmamenu_p04_jwt"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22 for signed-JWT HTTP assertions
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bootstrap production-derived RLS and synthetic sessions
        run: |
          docker run --rm --network host \
            -e PGPASSWORD=postgres -v "$PWD:/repo:ro" -w /repo postgres:17 \
            psql -h 127.0.0.1 -U postgres -d optmamenu_p04_jwt \
            -v ON_ERROR_STOP=1 -f supabase/tests/p02_customer_isolation_rls_pg17.sql
          docker run --rm --network host \
            -e PGPASSWORD=postgres -v "$PWD:/repo:ro" -w /repo postgres:17 \
            psql -h 127.0.0.1 -U postgres -d optmamenu_p04_jwt \
            -v ON_ERROR_STOP=1 -f supabase/tests/p04_postgrest_jwt_fixture.sql
      - name: Issue ephemeral signing key
        run: echo "P04_JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Launch pinned local PostgREST
        run: |
          docker run -d --name optmamenu-p04-jwt --network host \
            -e PGRST_DB_URI='postgres://authenticator:p04-only-local-postgrest@127.0.0.1:5432/optmamenu_p04_jwt' \
            -e PGRST_DB_SCHEMAS='public' -e PGRST_DB_ANON_ROLE='anon' \
            -e PGRST_JWT_SECRET="$P04_JWT_SECRET" -e PGRST_SERVER_PORT=3030 \
            postgrest/postgrest:v14.13
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null http://127.0.0.1:3030/; then exit 0; fi
            sleep 1
          done
          docker logs optmamenu-p04-jwt
          exit 1
      - name: Verify signed JWT HTTP and customer RLS
        run: node --test supabase/tests/p04_signed_jwt_postgrest.test.mjs
      - name: Remove ephemeral HTTP service
        if: always()
        run: docker rm -f optmamenu-p04-jwt || true

  p05-inventory-acl:
    name: P05 inventory RPC grant regression PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
