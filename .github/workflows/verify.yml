name: Verify

on:
  push:
    branches:
      - agent/quotation-round-purchase-drafts
      - agent/homologacao-geral-20260820
  pull_request:
    branches:
      - agent/homologacao-geral-20260820

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: P03 enforce grants on future public tables
        run: |
          node --test scripts/security/audit-future-table-grants.test.mjs
          node scripts/security/audit-future-table-grants.mjs

      - name: Install dependencies
        run: npm ci

      - name: Lint purchase receipt scope
        run: >-
          npx eslint
          src/pages/private/admin/products/inventory/PurchaseDocumentsPage.tsx
          src/pages/private/admin/products/inventory/components/PurchaseReceiptModal.tsx
          src/pages/private/admin/products/inventory/utils/purchaseReceiptUtils.ts
          src/pages/private/admin/products/inventory/utils/purchaseReceiptUtils.test.ts

      - name: Test disabled Asaas legacy endpoints
        run: node --test supabase/tests/p01_asaas_retirement.test.mjs

      - name: Security contract — payment internal RPC only via service_role
        run: node --test supabase/tests/p01_internal_payment_rpc_callers.test.mjs

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

  retired-asaas-db:
    name: P01 retired Asaas PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: optmamenu_legacy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d optmamenu_legacy_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test SQL migration with synthetic Asaas and OptmaPay
        run: |
          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            -v "$PWD:/repo:ro" -w /repo postgres:17 \
            psql -h 127.0.0.1 -U postgres -d optmamenu_legacy_test \
            -v ON_ERROR_STOP=1 -f supabase/tests/p01_retired_asaas_provider_pg17.sql

  p00-postgres-acl:
    name: P00 PostgreSQL 17 permissions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: optmamenu_acl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d optmamenu_acl_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Real PostgreSQL role-grant regression (synthetic data only)
        run: |
          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            -v "$PWD:/repo:ro" -w /repo \
            postgres:17 \
            psql -h 127.0.0.1 -U postgres -d optmamenu_acl_test \
            -v ON_ERROR_STOP=1 -f supabase/tests/p00_internal_payment_rpc_grants.sql
      - name: Simulate the October 30 future-table grant behavior
        run: |
          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            -v "$PWD:/repo:ro" -w /repo \
            postgres:17 \
            psql -h 127.0.0.1 -U postgres -d optmamenu_acl_test \
            -v ON_ERROR_STOP=1 -f supabase/tests/p01_future_table_grants.sql

  p02-customer-isolation:
    name: P02 customer-session isolation PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: optmamenu_p02_isolation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d optmamenu_p02_isolation"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate current customer and owner RLS expressions with synthetic sessions
        run: |
          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            -v "$PWD:/repo:ro" -w /repo postgres:17 \
            psql -h 127.0.0.1 -U postgres -d optmamenu_p02_isolation \
            -v ON_ERROR_STOP=1 -f supabase/tests/p02_customer_isolation_rls_pg17.sql
