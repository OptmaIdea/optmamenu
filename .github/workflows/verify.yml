            -v ON_ERROR_STOP=1 -f supabase/tests/p05_inventory_sync_acl_pg17.sql

  p06-internal-stock-gateway:
    name: P06 private inventory helper and signed JWT HTTP
    runs-on: ubuntu-latest
    timeout-minutes: 14
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
