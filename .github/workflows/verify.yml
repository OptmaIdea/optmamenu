name: Verify

on:
  push:
    branches:
      - agent/quotation-round-purchase-drafts
      - agent/homologacao-geral-20260820
  pull_request:
    branches:
      - agent/homologacao-geral-20260820

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint purchase receipt scope
        run: >-
          npx eslint
          src/pages/private/admin/products/inventory/PurchaseDocumentsPage.tsx
          src/pages/private/admin/products/inventory/components/PurchaseReceiptModal.tsx
          src/pages/private/admin/products/inventory/utils/purchaseReceiptUtils.ts
          src/pages/private/admin/products/inventory/utils/purchaseReceiptUtils.test.ts

      - name: Test disabled Asaas legacy endpoints
        run: node --test supabase/tests/p01_asaas_retirement.test.mjs

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

  retired-asaas-db:
    name: P01 retired Asaas PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: optmamenu_legacy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d optmamenu_legacy_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test SQL migration with synthetic Asaas and OptmaPay
        run: |
          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            -v "$PWD:/repo:ro" -w /repo postgres:17 \
            psql -h 127.0.0.1 -U postgres -d optmamenu_legacy_test \
            -v ON_ERROR_STOP=1 -f supabase/tests/p01_retired_asaas_provider_pg17.sql
